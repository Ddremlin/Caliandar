name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Finds the project even if it was uploaded inside a subfolder
      - name: Find project folder
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/build/*" | head -1)
          # Project uploaded as a .zip archive? Unpack it.
          if [ -z "$f" ]; then
            z=$(find . -name "*.zip" -not -path "./.git/*" | head -1)
            if [ -n "$z" ]; then
              echo "Unpacking $z"
              unzip -q -o "$z" -d unpacked
              f=$(find ./unpacked -name settings.gradle.kts -not -path "*/build/*" | head -1)
            fi
          fi
          if [ -z "$f" ]; then
            echo "Files in repository:"; find . -not -path "./.git/*" -type f | head -50
            echo "::error::Project not found. Upload Kaliandar.zip (or the project files) to the repository"
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          for need in build.gradle.kts gradle.properties app/build.gradle.kts app/src/main/AndroidManifest.xml app/src/main/cpp/CMakeLists.txt; do
            if [ ! -f "$dir/$need" ]; then echo "::error::Missing file: $need"; missing=1; fi
          done
          [ -z "$missing" ]

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: kaliandar-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
